name: DuckDB Wheel Mailbox

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch DuckDB wheel and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mailbox
          python -m pip download --only-binary=:all: --no-deps 'duckdb>=1.3,<2' -d mailbox
          python - <<'PY'
          import hashlib, json, pathlib, sys
          p=pathlib.Path("mailbox")
          wheels=list(p.glob("duckdb-*.whl"))
          if len(wheels)!=1:
              raise SystemExit(f"expected one wheel, got {wheels}")
          w=wheels[0]
          m={
              "python":sys.version,
              "wheel":w.name,
              "bytes":w.stat().st_size,
              "sha256":hashlib.sha256(w.read_bytes()).hexdigest(),
          }
          (p/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-wheel
          path: mailbox
          compression-level: 0
          retention-days: 1
