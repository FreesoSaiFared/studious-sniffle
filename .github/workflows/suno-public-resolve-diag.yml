name: Suno Public Clip Resolve Diagnostic
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve public clip and fetch media variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          ID='000397b5-ee2a-4d7d-96f9-233499b6f87d'
          API="https://studio-api.prod.suno.com/api/clip/$ID"
          code=$(curl -L -sS -D diag/clip.headers -o diag/clip.json -w '%{http_code}' "$API" || true)
          echo "$code" > diag/clip.http
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("diag")
          j=json.loads((p/"clip.json").read_text())
          urls=[]
          if j.get("audio_url"): urls.append(("audio_url",j["audio_url"]))
          for i,m in enumerate(j.get("media_urls") or []):
              if m.get("url"): urls.append((f"media_{i}_{m.get('content_type','unknown')}",m["url"]))
          (p/"resolved.json").write_text(json.dumps(urls,indent=2)+"\n")
          for name,url in urls:
              print(name,url)
          PY
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path("diag")
          for name,url in json.loads((p/"resolved.json").read_text()):
              safe="".join(c if c.isalnum() or c in "-_." else "_" for c in name)
              out=p/(safe+".bin")
              hdr=p/(safe+".headers")
              cmd=["curl","-L","-sS","--fail-with-body","-D",str(hdr),"-o",str(out),"-w","%{http_code}\t%{size_download}\t%{content_type}\n",url]
              q=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              (p/(safe+".curl")).write_text(q.stdout+q.stderr)
              if out.exists():
                  subprocess.run(["sha256sum",str(out)],stdout=(p/(safe+".sha256")).open("w"))
                  subprocess.run(["file",str(out)],stdout=(p/(safe+".file")).open("w"))
                  (p/(safe+".bytes")).write_text(str(out.stat().st_size)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: suno-public-resolve-diag
          path: diag
          compression-level: 6
          retention-days: 1
