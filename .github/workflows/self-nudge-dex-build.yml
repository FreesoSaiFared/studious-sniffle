name: Self-Nudge Dex Build

on:
  push:
    branches:
      - self-nudge-dex-build-20260830
      - self-nudge-sqc-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          rc=${PIPESTATUS[1]}
          set -o pipefail
          test "$rc" -eq 0
          test -f "${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          test -x "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2"
          test -x "${ANDROID_SDK_ROOT}/build-tools/35.0.0/d8"
          test -x "${ANDROID_SDK_ROOT}/build-tools/35.0.0/zipalign"
          test -x "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"

      - name: Run protocol and transport tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/ci/reconstruction"
          OUT="$GITHUB_WORKSPACE/ci/build/core-tests"
          mkdir -p "$OUT"
          javac --add-modules jdk.httpserver -d "$OUT"             "$ROOT"/core/src/science/transductive/nudge/core/*.java             "$ROOT"/android/app/src/main/java/science/transductive/nudge/WorkerClient.java             "$ROOT"/core/test/science/transductive/nudge/core/*.java
          java -cp "$OUT" science.transductive.nudge.core.CoreTests | tee "$GITHUB_WORKSPACE/ci/build/core-tests.log"
          java --add-modules jdk.httpserver -cp "$OUT" science.transductive.nudge.core.TransportTests | tee "$GITHUB_WORKSPACE/ci/build/transport-tests.log"
          java -cp "$OUT" science.transductive.nudge.core.AutomationTests | tee "$GITHUB_WORKSPACE/ci/build/automation-tests.log"
          java -cp "$OUT" science.transductive.nudge.core.MiniJsonTests | tee "$GITHUB_WORKSPACE/ci/build/mini-json-tests.log"
          java -Xmx512m -cp "$OUT" science.transductive.nudge.core.VmStressTests | tee "$GITHUB_WORKSPACE/ci/build/vm-stress-tests.log"
          java -cp "$OUT" science.transductive.nudge.core.BehaviorBundleTests | tee "$GITHUB_WORKSPACE/ci/build/behavior-bundle-tests.log"
          java -cp "$OUT" science.transductive.nudge.core.SignedBehaviorAcceptance | tee "$GITHUB_WORKSPACE/ci/build/signed-behavior-acceptance.log"
          java -cp "$OUT" science.transductive.nudge.core.ContextDocumentTests | tee "$GITHUB_WORKSPACE/ci/build/context-document-tests.log"
          java -cp "$OUT" science.transductive.nudge.core.SignedModuleManifestTests | tee "$GITHUB_WORKSPACE/ci/build/signed-module-tests.log"
          grep -q 'CORE_TESTS_PASS=17' "$GITHUB_WORKSPACE/ci/build/core-tests.log"
          grep -q 'TRANSPORT_TESTS_PASS=3' "$GITHUB_WORKSPACE/ci/build/transport-tests.log"
          grep -q 'AUTOMATION_TESTS_PASS=8' "$GITHUB_WORKSPACE/ci/build/automation-tests.log"
          grep -q 'MINI_JSON_TESTS_PASS=8' "$GITHUB_WORKSPACE/ci/build/mini-json-tests.log"
          grep -q 'VM_STRESS_TESTS_PASS=21' "$GITHUB_WORKSPACE/ci/build/vm-stress-tests.log"
          grep -q 'BEHAVIOR_BUNDLE_TESTS_PASS=12' "$GITHUB_WORKSPACE/ci/build/behavior-bundle-tests.log"
          grep -q 'SIGNED_BEHAVIOR_ACCEPTANCE_PASS=7' "$GITHUB_WORKSPACE/ci/build/signed-behavior-acceptance.log"
          grep -q 'CONTEXT_DOCUMENT_TESTS_PASS=5' "$GITHUB_WORKSPACE/ci/build/context-document-tests.log"
          grep -q 'SIGNED_MODULE_TESTS_PASS=9' "$GITHUB_WORKSPACE/ci/build/signed-module-tests.log"

      - name: Verify inverted-control debugger
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/agent-control/test_inverted_control_debugger.py 2>&1 | tee ci/build/inverted-control-tests.log
          grep -q 'INVERTED_CONTROL_TESTS_PASS=10' ci/build/inverted-control-tests.log

      - name: Verify exact Source Quarry donor slices
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/composition/verify_composition_lock.py 2>&1 | tee ci/build/composition-lock.log
          grep -q 'COMPOSITION_LOCK_PASS=15' ci/build/composition-lock.log

      - name: Verify Tier-1 signed behavior and context boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/composition/tier1_static_acceptance.py 2>&1 | tee ci/build/tier1-static.log
          grep -q 'TIER1_STATIC_PASS=21' ci/build/tier1-static.log
          test -s ci/build/tier1-static-receipt.json

      - name: Verify Tier-2 signed module boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/composition/tier2_static_acceptance.py 2>&1 | tee ci/build/tier2-static.log
          grep -q 'TIER2_STATIC_PASS=14' ci/build/tier2-static.log
          test -s ci/build/tier2-static-receipt.json

      - name: Verify physical-device harness source boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:GITHUB_WORKSPACE "ci/device-acceptance/run-adb-acceptance.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $src = Get-Content -Raw $path
          $required = @(
            'E:\android\platform-tools\adb.exe',
            'Get-Command adb',
            'ExpectedSha256',
            '-ConfirmInstall',
            'EnableAccessibilityViaAdb',
            'android.settings.ACCESSIBILITY_SETTINGS',
            'settings put secure enabled_accessibility_services',
            'science.transductive.nudge/.MainActivity',
            'Accessibility tree probe',
            'TREE_PROBE APPLIED',
            'Accessibility screenshot probe',
            'SCREENSHOT_PROBE APPLIED',
            'Signed behavior fixture probe',
            'SIGNED_BEHAVIOR_DEVICE_PROBE APPLIED',
            'Import diary/context document…',
            'sourceUri=content://',
            'com.openai.chatgpt',
            'UNKNOWN_OUTCOME',
            'shell am force-stop $Package',
            'logcat -d -v threadtime',
            'SELF_NUDGE_ADB_DEVICE_ACCEPTANCE/1',
            'DEVICE_ACCEPTANCE_PASS=1'
          )
          foreach ($needle in $required) {
            if (-not $src.Contains($needle)) { throw "Missing device-harness invariant: $needle" }
          }
          if (-not $src.Contains('[Parameter(Mandatory=$true)][ValidatePattern("^[0-9A-Fa-f]{64}$")][string]$ExpectedSha256')) {
            throw "ExpectedSha256 must be mandatory and a 64-hex digest"
          }
          $hashGate = $src.IndexOf('APK_HASH_MISMATCH')
          $installGate = $src.IndexOf('if (-not $ConfirmInstall)')
          $install = $src.IndexOf('install -r')
          if ($hashGate -lt 0 -or $installGate -lt 0 -or $install -lt 0 -or $hashGate -gt $install -or $installGate -gt $install) {
            throw "Hash and confirmation gates must precede adb install"
          }
          $accessGate = $src.IndexOf('if (-not $EnableAccessibilityViaAdb)')
          $secureWrite = $src.IndexOf('settings put secure enabled_accessibility_services')
          if ($accessGate -lt 0 -or $secureWrite -lt 0 -or $accessGate -gt $secureWrite) {
            throw "Accessibility secure-setting write must be behind explicit ADB gate"
          }
          "PHYSICAL_HARNESS_STATIC_PASS=26" | Tee-Object -FilePath "ci/build/device-harness-static.log"

      - name: Compile resources and link manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/ci/reconstruction"
          BUILD="$GITHUB_WORKSPACE/ci/build/android"
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          rm -rf "$BUILD"
          mkdir -p "$BUILD/gen" "$BUILD/classes" "$BUILD/dex"
          "$BT/aapt2" compile --dir "$ROOT/android/app/src/main/res" -o "$BUILD/resources.zip"
          "$BT/aapt2" link             -o "$BUILD/resources.apk"             --manifest "$ROOT/android/app/src/main/AndroidManifest.xml"             -I "$ANDROID_JAR"             --java "$BUILD/gen"             --min-sdk-version 26             --target-sdk-version 35             --version-code 1             --version-name 0.1-dex             "$BUILD/resources.zip"
          "$BT/aapt2" dump badging "$BUILD/resources.apk" | tee "$BUILD/aapt-badging-pre-dex.txt"

      - name: Compile Java and dex
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/ci/reconstruction"
          BUILD="$GITHUB_WORKSPACE/ci/build/android"
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          find "$ROOT/core/src" "$ROOT/android/app/src/main/java" "$BUILD/gen" -name '*.java' -print | sort > "$BUILD/sources.list"
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d "$BUILD/classes" @"$BUILD/sources.list" 2>&1 | tee "$BUILD/javac.log"
          jar cf "$BUILD/classes.jar" -C "$BUILD/classes" .
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output "$BUILD/dex" "$BUILD/classes.jar" 2>&1 | tee "$BUILD/d8.log"
          test -s "$BUILD/dex/classes.dex"

      - name: Assemble align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/ci/build/android"
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          cp "$BUILD/resources.apk" "$BUILD/with-dex.apk"
          (cd "$BUILD/dex" && zip -q -j "$BUILD/with-dex.apk" classes*.dex)
          "$BT/zipalign" -f -p 4 "$BUILD/with-dex.apk" "$BUILD/aligned.apk"
          "$BT/zipalign" -c -p 4 "$BUILD/aligned.apk"
          keytool -genkeypair -noprompt             -keystore "$BUILD/debug.keystore"             -storepass android -keypass android             -alias androiddebugkey             -dname "CN=Self-Nudge Development,O=Transductive,C=NL"             -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign             --ks "$BUILD/debug.keystore"             --ks-pass pass:android             --key-pass pass:android             --out "$BUILD/self-nudge-dex-v0.1-ci.apk"             "$BUILD/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$BUILD/self-nudge-dex-v0.1-ci.apk" | tee "$BUILD/apksigner-verify.txt"
          "$BT/aapt2" dump badging "$BUILD/self-nudge-dex-v0.1-ci.apk" | tee "$BUILD/aapt-badging.txt"
          unzip -l "$BUILD/self-nudge-dex-v0.1-ci.apk" | tee "$BUILD/apk-contents.txt"
          grep -q 'classes.dex' "$BUILD/apk-contents.txt"
          grep -q "package: name='science.transductive.nudge'" "$BUILD/aapt-badging.txt"
          grep -q "minSdkVersion:'26'" "$BUILD/aapt-badging.txt"
          grep -q "targetSdkVersion:'35'" "$BUILD/aapt-badging.txt"
          sha256sum "$BUILD/self-nudge-dex-v0.1-ci.apk" | tee "$BUILD/sha256.txt"

      - name: Write deterministic CI receipt
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/ci/build/android"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          b=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"ci/build/android"
          apk=b/"self-nudge-dex-v0.1-ci.apk"
          sig=(b/"apksigner-verify.txt").read_text()
          badging=(b/"aapt-badging.txt").read_text()
          data={
            "schema":"SELF_NUDGE_DEX_CI_RECEIPT/1",
            "status":"PASS",
            "git_sha":os.environ["GITHUB_SHA"],
            "apk":{"name":apk.name,"bytes":apk.stat().st_size,"sha256":hashlib.sha256(apk.read_bytes()).hexdigest()},
            "package":"science.transductive.nudge",
            "min_sdk":26,
            "target_sdk":35,
            "classes_dex":True,
            "core_tests":"17/17 PASS",
            "transport_tests":"3/3 PASS",
            "automation_tests":"8/8 PASS",
            "mini_json_tests":"8/8 PASS",
            "vm_stress_tests":"21/21 PASS",
            "inverted_control_tests":"10/10 PASS",
            "behavior_bundle_tests":"12/12 PASS",
            "signed_behavior_acceptance":"7/7 PASS",
            "context_document_tests":"5/5 PASS",
            "signed_module_tests":"9/9 PASS",
            "tier1_static_checks":"21/21 PASS",
            "tier2_static_checks":"14/14 PASS",
            "physical_harness_static_checks":"26/26 PASS",
            "signature":{
              "v1":"Verified using v1 scheme (JAR signing): true" in sig,
              "v2":"Verified using v2 scheme (APK Signature Scheme v2): true" in sig,
              "v3":"Verified using v3 scheme (APK Signature Scheme v3): true" in sig,
              "v31":"Verified using v3.1 scheme (APK Signature Scheme v3.1): true" in sig,
            },
            "android_badging_package_ok":"package: name='science.transductive.nudge'" in badging,
            "acceptance_boundary":"CI_BUILD_PASS_PHYSICAL_DEVICE_UNVERIFIED"
          }
          (b/"dex-ci-receipt.json").write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Upload Dex APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: self-nudge-dex-v0.1-ci
          path: |
            ci/build/android/self-nudge-dex-v0.1-ci.apk
            ci/build/android/dex-ci-receipt.json
            ci/build/android/apksigner-verify.txt
            ci/build/android/aapt-badging.txt
            ci/build/android/apk-contents.txt
            ci/build/android/javac.log
            ci/build/android/d8.log
            ci/build/core-tests.log
            ci/build/transport-tests.log
            ci/build/automation-tests.log
            ci/build/mini-json-tests.log
            ci/build/vm-stress-tests.log
            ci/build/inverted-control-tests.log
            ci/agent-control/inverted_control_debugger.py
            ci/agent-control/test_inverted_control_debugger.py
            ci/agent-control/SELF_NUDGE_PHYSICAL_PLAN.json
            ci/reconstruction/core/src
            ci/reconstruction/core/test
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/WorkerClient.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/AutomationJournal.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/ChatGptAutomationEngine.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/CapabilityProbe.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/ContextDocumentContract.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/ContextDocumentStore.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/DeviceSelfTest.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/SignedModuleInstaller.java
            ci/reconstruction/android/app/src/main/java/science/transductive/nudge/TrustedBehaviorKeys.java
            ci/build/behavior-bundle-tests.log
            ci/build/signed-behavior-acceptance.log
            ci/build/context-document-tests.log
            ci/build/signed-module-tests.log
            ci/build/composition-lock.log
            ci/build/tier1-static.log
            ci/build/tier1-static-receipt.json
            ci/build/tier2-static.log
            ci/build/tier2-static-receipt.json
            ci/build/device-harness-static.log
            ci/composition/COMPOSITION.lock.json
            ci/composition/DONOR_COMPOSITION.md
            ci/composition/NEGATIVE_DONORS.md
            ci/composition/CLOSURE_RESIDUAL.md
            ci/composition/tier1_static_acceptance.py
            ci/composition/tier2_static_acceptance.py
            ci/composition/TIER1_ACCEPTANCE.json
            ci/optional-context/OPTIONAL_CONTEXT_ACCEPTANCE.json
            ci/device-acceptance/run-adb-acceptance.ps1
            ci/device-acceptance/README.md
            ci/SOURCE_BUILD_PROVENANCE.md
          if-no-files-found: error


  optional-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          rc=${PIPESTATUS[1]}
          set -o pipefail
          test "$rc" -eq 0

      - name: Verify optional context source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s ci/optional-context/OPTIONAL_CONTEXT.lock.json
          test -s ci/optional-context/THIRD_PARTY_NOTICES.md
          ! grep -R 'android.permission.health.WRITE_' ci/optional-context/health/src/main
          grep -q 'getGrantedPermissions' ci/optional-context/health/src/main/java/science/transductive/nudge/health/HealthContextAdapter.kt
          grep -q 'SecurityException' ci/optional-context/health/src/main/java/science/transductive/nudge/health/HealthContextAdapter.kt
          grep -q 'MAX_SAMPLES=4096' ci/optional-context/sensing/src/main/java/science/transductive/nudge/sensing/ProsodyFeatureExtractor.java
          grep -q 'setOutputFaceBlendshapes(true)' ci/optional-context/sensing/src/main/java/science/transductive/nudge/sensing/FaceBlendshapeSensor.java
          grep -q '"authority": "RAW_SIGNAL_OBSERVATIONS_ONLY"' ci/optional-context/OPTIONAL_CONTEXT.lock.json

      - name: Compile and test optional sensing and health modules
        shell: bash
        run: |
          set -euo pipefail
          gradle -p ci/optional-context --no-daemon --stacktrace \
            :sensing:testDebugUnitTest :health:testDebugUnitTest \
            :sensing:assembleDebug :health:assembleDebug | tee ci/optional-context/optional-context-gradle.log
          test -s ci/optional-context/sensing/build/outputs/aar/sensing-debug.aar
          test -s ci/optional-context/health/build/outputs/aar/health-debug.aar
          test -s ci/optional-context/sensing/src/main/assets/face_landmarker.task
          unzip -l ci/optional-context/sensing/build/outputs/aar/sensing-debug.aar | tee ci/optional-context/sensing-aar.txt
          grep -q 'assets/face_landmarker.task' ci/optional-context/sensing-aar.txt

      - name: Write optional context receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path("ci/optional-context")
          files={
            "face_model":root/"sensing/src/main/assets/face_landmarker.task",
            "sensing_aar":root/"sensing/build/outputs/aar/sensing-debug.aar",
            "health_aar":root/"health/build/outputs/aar/health-debug.aar",
          }
          def info(path):
              b=path.read_bytes()
              return {"path":str(path),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
          data={
            "schema":"SELF_NUDGE_OPTIONAL_CONTEXT_RECEIPT/1",
            "status":"PASS",
            "git_sha":os.environ["GITHUB_SHA"],
            "toolchain":{"gradle":"8.10.2","agp":"8.7.3","kotlin":"1.9.25","compile_sdk":35},
            "mediapipe":"com.google.mediapipe:tasks-vision:1.0.0",
            "health_connect":"androidx.health.connect:connect-client:1.1.0-alpha12",
            "prosody":{"donor":"thestbar/tunify@836876a1b30581ad99495bfde74b4060df06f17d","features":["rms","zero_crossing_rate","pitch_hz","periodicity"],"authority":"RAW_SIGNAL_OBSERVATIONS_ONLY"},
            "health":{"record_types":["STEPS","HEART_RATE","SLEEP"],"access":"READ_ONLY_EXPLICIT_PER_RECORD_PERMISSION"},
            "artifacts":{k:info(v) for k,v in files.items()},
            "core_apk_dependency":"NONE"
          }
          out=root/"optional-context-receipt.json"
          out.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Upload optional context evidence
        uses: actions/upload-artifact@v4
        with:
          name: self-nudge-optional-context
          path: |
            ci/optional-context/optional-context-receipt.json
            ci/optional-context/optional-context-gradle.log
            ci/optional-context/sensing-aar.txt
            ci/optional-context/sensing/build/outputs/aar/sensing-debug.aar
            ci/optional-context/health/build/outputs/aar/health-debug.aar
            ci/optional-context/OPTIONAL_CONTEXT.lock.json
            ci/optional-context/THIRD_PARTY_NOTICES.md
          if-no-files-found: error


  tier3-script-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform/build tools 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          rc=${PIPESTATUS[1]}
          set -o pipefail
          test "$rc" -eq 0

      - name: Verify Tier-3 script boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/on-device-build/build-self-nudge.sh
          bash -n ci/on-device-build/install-self-nudge.sh
          grep -q 'INSTALL_NOT_PERFORMED=1' ci/on-device-build/build-self-nudge.sh
          ! grep -q 'adb install' ci/on-device-build/build-self-nudge.sh
          grep -q -- '--confirm-install' ci/on-device-build/install-self-nudge.sh
          grep -q 'previous-built.apk' ci/on-device-build/install-self-nudge.sh
          grep -q 'r8-8.13.19.jar' ci/on-device-build/build-self-nudge.sh

      - name: Execute exact Tier-3 build script on Linux oracle
        shell: bash
        env:
          REPO: ${{ github.workspace }}
          R8JAR: ${{ github.workspace }}/ci/build/tier3-r8-8.13.19.jar
          STATE_DIR: ${{ github.workspace }}/ci/build/tier3-state
        run: |
          set -euo pipefail
          mkdir -p ci/build
          export ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          export PATH="${ANDROID_SDK_ROOT}/build-tools/35.0.0:$PATH"
          bash ci/on-device-build/build-self-nudge.sh 2>&1 | tee ci/build/tier3-script-oracle.log
          grep -q 'TIER3_ON_DEVICE_BUILD_PASS=1' ci/build/tier3-script-oracle.log
          grep -q 'INSTALL_NOT_PERFORMED=1' ci/build/tier3-script-oracle.log
          test -s ci/build/tier3-state/last-built.apk
          test -s ci/build/tier3-state/last-build-receipt.json
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("ci/build/tier3-state/last-build-receipt.json")
          d=json.loads(p.read_text())
          assert d["status"]=="PASS"
          assert d["install_performed"] is False
          assert d["acceptance_boundary"]=="BUILT_ON_ANDROID_DEVICE_NOT_INSTALLED_NOT_RUNTIME_VERIFIED"
          print("TIER3_SCRIPT_ORACLE_PASS=1")
          PY

      - name: Upload Tier-3 script oracle
        uses: actions/upload-artifact@v4
        with:
          name: self-nudge-tier3-script-oracle
          path: |
            ci/build/tier3-state/last-built.apk
            ci/build/tier3-state/last-build-receipt.json
            ci/build/tier3-script-oracle.log
            ci/on-device-build/build-self-nudge.sh
            ci/on-device-build/install-self-nudge.sh
            ci/on-device-build/TIER3_BUILD.lock.json
            ci/on-device-build/README.md
          if-no-files-found: error
